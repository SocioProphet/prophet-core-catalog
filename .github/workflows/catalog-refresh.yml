name: catalog-refresh

# CENTRAL re-harvest — makes the contribution loop LIVE with NO operator App token.
#
# The distributed path (assemble-catalog.yml) waits for each estate repo to push its
# own shard via a GitHub App installation token. This central path needs none of that:
# the SocioProphet estate repos are readable, so a scheduled job INSIDE this repo can
# read-only clone them, re-run the shared extractors here, refresh the per-repo shards,
# reassemble + reindex, and commit with the same-repo GITHUB_TOKEN. The App token later
# upgrades this to distributed real-time; until then this keeps the catalog fresh.
#
# The two paths CONVERGE: both write datasets/<ds>/contributions/<repo>.jsonl and both
# run tools/assemble_dataset.py. See docs/CATALOG-PERCOLATION.md.
#
# FAIL-CLOSED: the percolation canary + schema/graph validators run BEFORE the commit
# step; if any fails the job aborts and nothing lands. No-op guarded (skip commit if the
# tree is unchanged). Concurrency-grouped so scheduled + manual runs never overlap.

on:
  schedule:
    - cron: "17 6 * * *"      # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Max repos to clone (0 = all first-party code repos from sources/)."
        required: false
        default: "0"
      public_only:
        description: "Only clone repos marked auth:none / privacy:public."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator deps
        run: pip install --quiet jsonschema rdflib pyshacl

      - name: Select estate repos to re-harvest (data-driven from sources/)
        id: select
        run: |
          set -euo pipefail
          ARGS=(--limit "${{ github.event.inputs.limit || '0' }}")
          if [ "${{ github.event.inputs.public_only || 'false' }}" = "true" ]; then
            ARGS+=(--public-only)
          fi
          python3 tools/select_refresh_repos.py "${ARGS[@]}" > "$RUNNER_TEMP/repos.tsv"
          echo "selected $(wc -l < "$RUNNER_TEMP/repos.tsv") repo(s)"
          cat "$RUNNER_TEMP/repos.tsv"

      - name: Read-only clone each repo and re-run extractors -> per-repo shards
        run: |
          set -uo pipefail
          CLONES="$RUNNER_TEMP/clones"; STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$CLONES" "$STAGE"
          REGEX_CONTRIB="datasets/regex-operational-dataset/contributions"
          # Whole-catalog harvest: every dataset with a REAL per-repo extractor
          # (extractors/harvest_map.json) refreshes its own committed shard each run.
          # module : dataset-dir : shard-subdir
          HARVEST="\
          extract_schemas_contracts:schemas-contracts:contributions \
          extract_services_endpoints:services-endpoints:contributions \
          extract_ontologies:ontologies:contributions \
          extract_adrs_docs:adrs-docs:contributions \
          extract_agents_manifests:agents-manifests:contributions \
          extract_rules_policies:rules-policies:contributions \
          extract_ci_workflows_tests:ci-workflows-tests:contributions \
          extract_models:models:harvest"
          ok=0; skipped=0
          while IFS=$'\t' read -r slug repo_name; do
            [ -z "$slug" ] && continue
            dst="$CLONES/$repo_name"
            # Anonymous, shallow, read-only. Public repos need no auth; the same-repo
            # GITHUB_TOKEN cannot read other repos, so we do NOT use it here. Any repo
            # that does not clone (private / moved) is skipped — fail-OPEN per repo,
            # fail-CLOSED on the canary below.
            if ! git clone --depth 1 --quiet "https://github.com/$slug.git" "$dst" 2>/dev/null; then
              echo "skip  $slug (not anonymously cloneable)"; skipped=$((skipped+1)); continue
            fi
            # Schema-matched regex extractor -> committed regex dataset shard.
            python3 extractors/extract_regex.py "$dst" "$repo_name" \
              --out "$REGEX_CONTRIB/$repo_name.jsonl" || true
            # Whole-catalog extractors -> committed per-repo shards. Each writes a shard
            # matching its dataset's record schema; tools/assemble_dataset.py then rebuilds
            # the dataset's primary file(s) from ALL shards (harvest mode). A crashing
            # extractor is isolated (|| true) so one bad repo cannot wedge the harvest.
            for spec in $HARVEST; do
              ex="${spec%%:*}"; rest="${spec#*:}"; ds="${rest%%:*}"; sub="${rest##*:}"
              mkdir -p "datasets/$ds/$sub"
              python3 "extractors/extract_${ex}.py" "$dst" "$repo_name" \
                --out "datasets/$ds/$sub/$repo_name.jsonl" 2>/dev/null || true
            done
            # topic-vocabulary is a CENTRAL rebuild (LSA/LSI/LDA over the whole corpus, not
            # a per-repo shard — see docs/CATALOG-EXTRACTORS.md); its hook runs to STAGING.
            mkdir -p "$STAGE/topic_vocabulary"
            python3 extractors/extract_topic_vocabulary.py "$dst" "$repo_name" \
              --out "$STAGE/topic_vocabulary/$repo_name.jsonl" 2>/dev/null || true
            echo "ok    $slug"; ok=$((ok+1))
            rm -rf "$dst"
          done < "$RUNNER_TEMP/repos.tsv"
          echo "re-harvested $ok repo(s), skipped $skipped"
          if [ "$ok" -eq 0 ]; then
            echo "::error::no repos re-harvested — refusing to proceed (fail-closed)"; exit 1
          fi

      - name: Upload staged (central-rebuild) topic-vocabulary hook output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-topic-vocabulary
          path: ${{ runner.temp }}/stage
          if-no-files-found: ignore

      - name: Assemble corpus from refreshed shards
        run: python3 tools/assemble_dataset.py --all

      - name: Regenerate estate graph (population + edges + typed models)
        run: |
          python3 tools/emit_estate_graph.py
          python3 tools/emit_estate_edges.py
          python3 tools/emit_model_catalog.py

      - name: Rebuild queryable index + DataHub metadata
        run: |
          python3 tools/build_catalog_index.py
          python3 tools/emit_datahub.py

      - name: Validate (fail-closed) — manifests + estate graph conformance
        run: |
          python3 tools/validate_dataset_manifest.py
          python3 tools/validate_estate_graph.py

      - name: Percolation canary (FAIL-CLOSED — no commit if the catalog stops percolating)
        run: python3 tools/verify_percolation.py

      - name: Commit refreshed catalog (skip if unchanged)
        run: |
          set -euo pipefail
          git config user.name  "catalog-refresh[bot]"
          git config user.email "catalog-refresh[bot]@users.noreply.github.com"
          git add datasets/**/contributions/*.jsonl \
                  datasets/models/harvest/*.jsonl \
                  datasets/*/*.jsonl \
                  datasets/estate-graph/*.ttl \
                  catalog-index/** \
                  datahub/** 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no refresh changes to commit — catalog already current"
          else
            git commit -m "chore(catalog): central re-harvest — refresh shards, index, graph [skip ci]"
            git push
          fi
