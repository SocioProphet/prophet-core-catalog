# DataHub file-source ingestion recipe for the SocioProphet asset catalog.
# Requires a running DataHub GMS. Load with: datahub ingest -c datahub/recipe.yml
# The MCPs are regenerated by tools/emit_datahub.py from catalog-index/.
source:
  type: file
  config:
    path: ./datahub/catalog-mcps.json
sink:
  type: datahub-rest
  config:
    server: ${DATAHUB_GMS_URL:-http://localhost:8080}
    token: ${DATAHUB_GMS_TOKEN:-}
